name: Publish Docker Image
# auto-build for newmain branch

on:
  push:
    branches:
      - newmain
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Docker platforms to build"
        required: false
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - "linux/amd64"
          - "linux/amd64,linux/arm64"

env:
  IMAGE_NAME: chatgpt2api
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name (GHCR requires lowercase)
        id: image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Read project version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # newmain branch: floating + sha + version-labeled tags
            type=raw,value=newmain,enable=${{ github.ref == 'refs/heads/newmain' }}
            type=raw,value=newmain-${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/newmain' }}
            type=sha,prefix=newmain-,format=short,enable=${{ github.ref == 'refs/heads/newmain' }}
            # release tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # manual dispatch on any ref
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/newmain' && !startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Resolve platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.platforms }}" ]; then
            echo "value=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "## Docker image published"
            echo ""
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo "- **Image:** \`${{ steps.image.outputs.name }}\`"
            echo "- **Version:** \`${{ steps.version.outputs.value }}\`"
            echo "- **Platforms:** \`${{ steps.platforms.outputs.value }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "### Pull (public package)"
            echo '```bash'
            echo "docker pull ${{ steps.image.outputs.name }}:newmain"
            echo '```'
            echo ""
            echo "### Pull (private package)"
            echo '```bash'
            echo "echo \$GHCR_TOKEN | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin"
            echo "docker pull ${{ steps.image.outputs.name }}:newmain"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"